# Render Blueprint — deploys on the current (free) plan so pushes always go live.
#
# For PERSISTENT data (accounts survive redeploys/sleep) do it from the DASHBOARD, not here,
# so it never blocks deploys: Render → flux → Settings → Disks → Add Disk (mount /data, 1 GB;
# this upgrades the instance to a paid plan), then add an env var DB_PATH=/data/flux.db.
#
# For real reset-code emails: add RESEND_API_KEY in the dashboard (declared below as a secret).
services:
  - type: web
    name: flux
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /login.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: RESEND_API_KEY
        sync: false            # paste your resend.com key in the dashboard (kept out of git)
