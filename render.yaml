# Render Blueprint — persistent data + real reset emails.
# A 1 GB disk keeps the SQLite database across redeploys/sleep (requires a paid instance).
# RESEND_API_KEY (set its value in the Render dashboard) makes verification codes email for real.
services:
  - type: web
    name: flux
    runtime: node
    plan: starter          # a persistent disk requires a paid instance (Starter ~$7/mo)
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /login.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DB_PATH
        value: /data/flux.db        # database lives on the persistent disk below
      - key: RESEND_API_KEY
        sync: false                 # paste your key from resend.com in the dashboard (kept out of git)
      # - key: FLUX_MAIL_FROM
      #   value: "Flux <no-reply@yourdomain.com>"   # optional; defaults to Resend's onboarding sender
    disk:
      name: flux-data
      mountPath: /data
      sizeGB: 1
