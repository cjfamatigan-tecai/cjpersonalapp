# Render Blueprint — FREE tier (zero cost).
# No persistent disk: the SQLite database is ephemeral (resets on each redeploy) and the
# instance sleeps when idle. Great for a demo. To make data persistent later, switch
# plan to "starter" and add a disk (see DEPLOY.md) — data survives restarts then.
services:
  - type: web
    name: flux
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /login.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      # --- optional: real password-reset emails ---
      # - key: RESEND_API_KEY
      #   sync: false                       # set the value in the dashboard (kept out of git)
      # - key: FLUX_MAIL_FROM
      #   value: "Flux <no-reply@yourdomain.com>"
