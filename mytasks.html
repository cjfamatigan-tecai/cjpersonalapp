<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flux My Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/flux.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="side"></aside>
    <main class="main" id="main">
      <header class="topbar" id="topbar"></header>

      <section class="grid g2">
        <div class="card span-2">
          <div class="card-head">
            <div class="card-title">In progress (<span id="activeCount">0</span>)</div>
            <button class="btn" id="addTaskBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg> Add task</button>
          </div>
          <div class="list" id="activeList"></div>
        </div>
      </section>

      <section class="grid g2">
        <div class="card span-2">
          <div class="card-head">
            <div class="card-title">Archived (<span id="archCount">0</span>)</div>
          </div>
          <div class="list" id="archList"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="assets/flux.js"></script>
  <script>
    const F = Flux;
    let tasks = [], archived = [];
    const IC = {
      flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 21V4m0 0h11l-2 4 2 4H5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.9 6 6.1.9-4.5 4.3 1.1 6.3L12 17.8 6.4 20.5l1.1-6.3L3 9.9 9.1 9 12 3z" stroke-linejoin="round"/></svg>',
      gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13M12 8S9 3 6 5s2 3 6 3zm0 0s3-5 6-3-2 3-6 3z" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      cross: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6V3z" stroke-linejoin="round"/></svg>',
      bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8M10 21a2 2 0 004 0" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h6l-1 6 3 3H7l3-3-1-6zM12 13v7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z" stroke-linejoin="round"/></svg>',
      archive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 001 1h12a1 1 0 001-1V8M10 12h4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      restore: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9 9 0 00-8 5M3 3v5h5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    };

    async function loadAll() {
      tasks = (await F.api('/state')).tasks;
      archived = (await F.api('/tasks/archived')).tasks;
      render();
    }
    function render() { renderActive(); renderArchived(); }

    function renderActive() {
      document.getElementById('activeCount').textContent = tasks.length;
      const el = document.getElementById('activeList');
      if (!tasks.length) { el.innerHTML = `<div style="color:var(--muted);font-weight:600;padding:16px 4px">No tasks yet. Click “Add task”.</div>`; return; }
      el.innerHTML = tasks.map(t => `<div class="list-row">
        <div class="l-ico">${IC[t.icon] || IC.flag}</div>
        <div class="l-main"><div class="l-title"></div><div class="l-sub">${t.pinned ? '📌 Pinned · ' : ''}${F.escapeHtml(t.date)}</div></div>
        <div class="row-actions">
          <button class="mini-btn" data-act="bell" data-id="${t.id}" title="Reminder" style="${t.bell ? 'background:var(--ink);color:var(--card);border-color:var(--ink)' : ''}">${IC.bell}</button>
          <button class="mini-btn" data-act="pin" data-id="${t.id}" title="${t.pinned ? 'Unpin' : 'Pin'}">${IC.pin}</button>
          <button class="mini-btn" data-act="edit" data-id="${t.id}" title="Edit">${IC.edit}</button>
          <button class="mini-btn" data-act="archive" data-id="${t.id}" title="Archive">${IC.archive}</button>
          <button class="mini-btn" data-act="delete" data-id="${t.id}" title="Delete">${IC.trash}</button>
        </div></div>`).join('');
      el.querySelectorAll('.list-row').forEach((row, i) => { row.querySelector('.l-title').textContent = tasks[i].title; });
      el.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => act(b.dataset.act, tasks.find(x => x.id == b.dataset.id))));
    }

    function renderArchived() {
      document.getElementById('archCount').textContent = archived.length;
      const el = document.getElementById('archList');
      if (!archived.length) { el.innerHTML = `<div style="color:var(--muted);font-weight:600;padding:16px 4px">Nothing archived. Archive a task to keep it out of the way without deleting it.</div>`; return; }
      el.innerHTML = archived.map(t => `<div class="list-row">
        <div class="l-ico">${IC[t.icon] || IC.flag}</div>
        <div class="l-main"><div class="l-title"></div><div class="l-sub">${F.escapeHtml(t.date)}</div></div>
        <div class="row-actions">
          <button class="mini-btn" data-rest="${t.id}" title="Restore">${IC.restore}</button>
          <button class="mini-btn" data-del="${t.id}" title="Delete" style="color:var(--down)">${IC.trash}</button>
        </div></div>`).join('');
      el.querySelectorAll('.list-row').forEach((row, i) => { row.querySelector('.l-title').textContent = archived[i].title; });
      el.querySelectorAll('[data-rest]').forEach(b => b.addEventListener('click', async () => { await F.api('/tasks/' + b.dataset.rest, 'PATCH', { archived: false }); await loadAll(); F.toast('Task restored'); }));
      el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => { await F.api('/tasks/' + b.dataset.del, 'DELETE'); await loadAll(); F.toast('Task deleted'); }));
    }

    async function act(a, t) {
      if (!t) return;
      if (a === 'bell') { await F.api('/tasks/' + t.id, 'PATCH', { bell: !t.bell }); F.toast(!t.bell ? 'Reminder on 🔔' : 'Reminder off'); }
      if (a === 'pin') { await F.api('/tasks/' + t.id, 'PATCH', { pinned: !t.pinned }); F.toast(!t.pinned ? 'Pinned 📌' : 'Unpinned'); }
      if (a === 'edit') { const v = prompt('Edit task', t.title); if (!v || !v.trim()) return; await F.api('/tasks/' + t.id, 'PATCH', { title: v.trim() }); F.toast('Task updated'); }
      if (a === 'archive') { await F.api('/tasks/' + t.id, 'PATCH', { archived: true }); F.toast('Task archived'); }
      if (a === 'delete') { await F.api('/tasks/' + t.id, 'DELETE'); F.toast('Task deleted'); }
      await loadAll();
    }

    async function addTask() {
      const title = prompt('New task name'); if (!title || !title.trim()) return;
      const icons = ['flag', 'star', 'gift', 'cross'];
      await F.api('/tasks', 'POST', { title: title.trim(), icon: icons[Math.floor(Math.random() * icons.length)] });
      await loadAll(); F.toast('Task added ✓');
    }
    document.getElementById('addTaskBtn').addEventListener('click', addTask);

    (async function () {
      await F.mountShell({ active: 'personal', subtitle: 'My Tasks', extraNav: F.personalNav('mytasks') });
      await loadAll();
    })();
  </script>
</body>
</html>
